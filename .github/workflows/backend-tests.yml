name: Backend tests

on:
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "Backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://revluma:revluma@localhost:5432/revluma
          DIRECT_URL: postgresql://revluma:revluma@localhost:5432/revluma
        run: npm run prisma -- validate
      - name: Run complete backend test suite
        run: |
          set -o pipefail
          set +e
          npm test 2>&1 | tee /tmp/revluma-backend-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -B 3 -A 22 'not ok' /tmp/revluma-backend-tests.log | head -80 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//'%'/'%25'}"
            done
          fi
          exit "$status"
