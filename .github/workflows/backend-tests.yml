name: Backend tests

on:
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches:
      - main
    paths:
      - "Backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run complete backend test suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/backend-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo '### Backend test failure tail'; echo '```text'; tail -n 180 /tmp/backend-tests.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
