name: Task 030 one-time production checkout replay
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type I_APPROVE_ONE_TEST_CHECKOUT to authorize the single test-store replay"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: task030-one-time-production-replay
  cancel-in-progress: false
jobs:
  controlled-replay:
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.confirmation == 'I_APPROVE_ONE_TEST_CHECKOUT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.TASK030_REPLAY_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TASK030_REPLAY_DATABASE_URL }}
      TASK030_REPLAY_APPROVED: ${{ github.event.inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify secret exists without disclosing its value
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::TASK030_REPLAY_DATABASE_URL secret is missing"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Execute one guarded replay
        run: node src/scripts/task030ControlledReplay.js
