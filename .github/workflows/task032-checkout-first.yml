name: Task 032 checkout-first delivery diagnostic
on:
  pull_request:
    paths:
      - 'Backend/src/tests/task032CheckoutFirst.integration.js'
      - 'Backend/src/services/commerceWebhookService.js'
      - '.github/workflows/task032-checkout-first.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task032:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: task032
          POSTGRES_PASSWORD: task032_local_only
          POSTGRES_DB: task032
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U task032 -d task032"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: postgresql://task032:task032_local_only@127.0.0.1:5432/task032?schema=public
      DIRECT_URL: postgresql://task032:task032_local_only@127.0.0.1:5432/task032?schema=public
      TASK032_ISOLATED_DB: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Enable pgvector
        run: PGPASSWORD=task032_local_only psql -h 127.0.0.1 -U task032 -d task032 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Create disposable schema
        run: npx prisma db push --skip-generate --accept-data-loss
      - name: Execute checkout-first diagnostic
        run: node src/tests/task032CheckoutFirst.integration.js
