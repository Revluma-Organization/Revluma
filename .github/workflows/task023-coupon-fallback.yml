name: Task 023 isolated coupon-fallback reconciliation
on:
  pull_request:
    paths:
      - "Backend/src/tests/task023CouponFallback.integration.js"
      - ".github/workflows/task023-coupon-fallback.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task023:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: task023
          POSTGRES_PASSWORD: task023_local_only
          POSTGRES_DB: task023
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task023 -d task023"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: postgresql://task023:task023_local_only@127.0.0.1:5432/task023?schema=public
      DIRECT_URL: postgresql://task023:task023_local_only@127.0.0.1:5432/task023?schema=public
      TASK023_ISOLATED_DB: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Enable vector extension
        run: PGPASSWORD=task023_local_only psql -h 127.0.0.1 -U task023 -d task023 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Initialize disposable Prisma schema
        run: npx prisma db push --skip-generate --accept-data-loss
      - name: Execute coupon-fallback rejection tests
        run: node src/tests/task023CouponFallback.integration.js
