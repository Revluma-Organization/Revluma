name: Backend refresh regression
on:
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-refresh-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: node --check src/controller/authController.js
      - run: npm test
