name: Backend refresh regression
on:
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-refresh-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: node --check src/controller/authController.js
      - run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/backend-refresh-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo '### Backend refresh test failure tail'; echo '```text'; tail -n 180 /tmp/backend-refresh-tests.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
