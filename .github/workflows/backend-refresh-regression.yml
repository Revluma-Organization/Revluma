name: Backend refresh regression
on:
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-refresh-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: node --check src/controller/authController.js
      - run: |
          set -o pipefail
          set +e
          npm test 2>&1 | tee /tmp/revluma-refresh-backend-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -B 3 -A 22 'not ok' /tmp/revluma-refresh-backend-tests.log | head -100 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//'%'/'%25'}"
            done
          fi
          exit "$status"
