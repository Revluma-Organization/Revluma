name: Task 021 isolated email-only reconciliation
on:
  pull_request:
    paths:
      - "Backend/src/tests/task021EmailOnly.integration.js"
      - ".github/workflows/task021-customer-identity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task021:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: task021
          POSTGRES_PASSWORD: task021_local_only
          POSTGRES_DB: task021
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task021 -d task021"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: postgresql://task021:task021_local_only@127.0.0.1:5432/task021?schema=public
      DIRECT_URL: postgresql://task021:task021_local_only@127.0.0.1:5432/task021?schema=public
      TASK021_ISOLATED_DB: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Enable vector extension
        run: PGPASSWORD=task021_local_only psql -h 127.0.0.1 -U task021 -d task021 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Initialize disposable Prisma schema
        run: npx prisma db push --skip-generate --accept-data-loss
      - name: Execute email-only rejection tests
        run: node src/tests/task021EmailOnly.integration.js
