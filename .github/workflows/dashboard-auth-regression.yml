name: Dashboard authentication regression
on:
  pull_request:
    paths:
      - 'Frontend/Dashboard/**'
      - '.github/workflows/dashboard-auth-regression.yml'
  workflow_dispatch:
jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/Dashboard/package-lock.json
      - run: npm ci
      - run: |
          set -o pipefail
          npm test -- --run 2>&1 | tee /tmp/test.log || {
            tail -c 60000 /tmp/test.log | sed -r 's/\x1b\[[0-9;]*m//g' | grep -vE "^\s*$|✓" | tail -120 > /tmp/tail.log
            echo "::error title=vitest tail::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' /tmp/tail.log)"
            exit 1
          }
      - run: npm run build
