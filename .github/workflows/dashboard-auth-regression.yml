name: Dashboard authentication regression
on:
  pull_request:
    paths:
      - 'Frontend/Dashboard/**'
      - '.github/workflows/dashboard-auth-regression.yml'
  workflow_dispatch:
jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/Dashboard/package-lock.json
      - run: npm ci
      - run: |
          set -o pipefail
          code=0; npm test -- --run > /tmp/test.log 2>&1 || code=$?
          if [ $code -ne 0 ]; then
            sed -r 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -vE "^\s*$|✓|act\(|fire events|assert on the output|This ensures|^\s+at |^\}\);|Warning: An update|When testing|^stderr \|" | tail -45 > /tmp/tail.log
            echo "exit=$code" >> /tmp/tail.log; free -m | head -2 >> /tmp/tail.log
            echo "::error title=vitest tail::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' /tmp/tail.log)"
            exit 1
          fi
      - run: npm run build
