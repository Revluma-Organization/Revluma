name: Task 016 isolated PostgreSQL checkout validation

on:
  pull_request:
    paths:
      - "Backend/src/tests/task016IsolatedPostgres.integration.js"
      - ".github/workflows/task016-isolated-postgres.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task016:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: task016
          POSTGRES_PASSWORD: task016_local_only
          POSTGRES_DB: task016
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task016 -d task016"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: postgresql://task016:task016_local_only@127.0.0.1:5432/task016?schema=public
      DIRECT_URL: postgresql://task016:task016_local_only@127.0.0.1:5432/task016?schema=public
      TASK016_ISOLATED_DB: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Enable pgvector in disposable PostgreSQL
        run: PGPASSWORD=task016_local_only psql -h 127.0.0.1 -U task016 -d task016 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Create isolated schema using Prisma
        run: npx prisma db push --skip-generate --accept-data-loss
      - name: Run checkout handler against real PostgreSQL
        run: node src/tests/task016IsolatedPostgres.integration.js
