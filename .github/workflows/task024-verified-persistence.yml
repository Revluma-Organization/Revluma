name: Task 024 isolated verified-persistence reconciliation
on:
  pull_request:
    paths:
      - "Backend/src/tests/task024VerifiedPersistence.integration.js"
      - ".github/workflows/task024-verified-persistence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task024:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: task024
          POSTGRES_PASSWORD: task024_local_only
          POSTGRES_DB: task024
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task024 -d task024"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: postgresql://task024:task024_local_only@127.0.0.1:5432/task024?schema=public
      DIRECT_URL: postgresql://task024:task024_local_only@127.0.0.1:5432/task024?schema=public
      TASK024_ISOLATED_DB: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Enable vector extension
        run: PGPASSWORD=task024_local_only psql -h 127.0.0.1 -U task024 -d task024 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Initialize disposable Prisma schema
        run: npx prisma db push --skip-generate --accept-data-loss
      - name: Execute verified-persistence rejection tests
        run: node src/tests/task024VerifiedPersistence.integration.js
