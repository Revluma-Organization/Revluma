name: Task 027 isolated ownership reconciliation
on:
  pull_request:
    paths:
      - "Backend/src/tests/task027Ownership.integration.js"
      - "Backend/src/services/commerceWebhookService.js"
      - "Backend/prisma/schema.prisma"
      - "Backend/prisma/migrations/20261030020000_task025_unresolved_reconciliation/migration.sql"
      - ".github/workflows/task027-ownership.yml"
  workflow_dispatch:
  push:
    branches:
      - "fix/mvp-task-027-checkout-order-ownership"
permissions:
  contents: read
jobs:
  task027:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: task027
          POSTGRES_PASSWORD: task027_local_only
          POSTGRES_DB: task027
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task027 -d task027"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: postgresql://task027:task027_local_only@127.0.0.1:5432/task027?schema=public
      DIRECT_URL: postgresql://task027:task027_local_only@127.0.0.1:5432/task027?schema=public
      TASK027_ISOLATED_DB: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Enable vector extension
        run: PGPASSWORD=task027_local_only psql -h 127.0.0.1 -U task027 -d task027 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Initialize disposable Prisma schema
        run: npx prisma db push --skip-generate --accept-data-loss
      - name: Validate additive migration against disposable existing schema
        run: |
          PGPASSWORD=task027_local_only psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U task027 -d task027 -c 'DROP TABLE "order_checkout_reconciliation_cases"; DROP INDEX "uq_orders_store_id";'
          PGPASSWORD=task027_local_only psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U task027 -d task027 -f prisma/migrations/20261030020000_task025_unresolved_reconciliation/migration.sql
      - name: Execute ownership rejection tests
        run: node src/tests/task027Ownership.integration.js
