name: Task 020 isolated customer-only reconciliation
on:
  pull_request:
    paths:
      - "Backend/src/tests/task020CustomerIdentity.integration.js"
      - ".github/workflows/task020-customer-identity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task020:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: task020
          POSTGRES_PASSWORD: task020_local_only
          POSTGRES_DB: task020
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task020 -d task020"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: postgresql://task020:task020_local_only@127.0.0.1:5432/task020?schema=public
      DIRECT_URL: postgresql://task020:task020_local_only@127.0.0.1:5432/task020?schema=public
      TASK020_ISOLATED_DB: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Enable vector extension
        run: PGPASSWORD=task020_local_only psql -h 127.0.0.1 -U task020 -d task020 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Initialize disposable Prisma schema
        run: npx prisma db push --skip-generate --accept-data-loss
      - name: Execute customer identity rejection tests
        run: node src/tests/task020CustomerIdentity.integration.js
