name: Task 025 isolated unresolved reconciliation
on:
  pull_request:
    paths:
      - "Backend/src/tests/task025Unresolved.integration.js"
      - "Backend/src/services/commerceWebhookService.js"
      - "Backend/prisma/schema.prisma"
      - "Backend/prisma/migrations/20261030020000_task025_unresolved_reconciliation/migration.sql"
      - ".github/workflows/task025-unresolved.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task025:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: task025
          POSTGRES_PASSWORD: task025_local_only
          POSTGRES_DB: task025
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task025 -d task025"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: postgresql://task025:task025_local_only@127.0.0.1:5432/task025?schema=public
      DIRECT_URL: postgresql://task025:task025_local_only@127.0.0.1:5432/task025?schema=public
      TASK025_ISOLATED_DB: "true"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Enable vector extension
        run: PGPASSWORD=task025_local_only psql -h 127.0.0.1 -U task025 -d task025 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - name: Initialize disposable Prisma schema
        run: npx prisma db push --skip-generate --accept-data-loss
      - name: Execute unresolved rejection tests
        run: node src/tests/task025Unresolved.integration.js
