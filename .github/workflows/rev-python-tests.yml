name: Rev Python regression tests

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/rev-python-tests.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/rev-python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: revluma_test
          POSTGRES_USER: revluma
          POSTGRES_PASSWORD: task198_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revluma -d revluma_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://placeholder:placeholder@localhost:5432/placeholder
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Set up Node.js for the repository Prisma migrations
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci
      - name: Initialize the real application schema with Prisma migrations
        working-directory: Backend
        env:
          DATABASE_URL: postgresql://revluma:task198_test_only@127.0.0.1:5432/revluma_test?schema=public
          DIRECT_URL: postgresql://revluma:task198_test_only@127.0.0.1:5432/revluma_test?schema=public
        run: |
          PGPASSWORD=task198_test_only psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U revluma -d revluma_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          npx prisma migrate deploy
      - name: Compile Python sources and tests
        run: python -m compileall -q src tests
      - name: Run Task 198 disposable PostgreSQL revenue integration tests
        env:
          TASK198_DATABASE_URL: postgresql+psycopg2://revluma:task198_test_only@127.0.0.1:5432/revluma_test
        run: python -m pytest -q tests/test_revenue_evidence_postgres.py
      - name: Run Gemini, routing and web research regressions
        run: python -m pytest -q tests/test_model_gateway.py tests/test_rev_failure_routing.py
      - name: Run all Python tests
        run: python -m pytest -q tests
      - name: Record Python interpreter and installed packages
        if: failure()
        run: |
          python --version
          python -m pip list --format=columns
