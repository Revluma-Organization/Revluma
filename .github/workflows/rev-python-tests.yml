name: Rev Python regression tests

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/rev-python-tests.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/rev-python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Disposable PostgreSQL so the gated revenue-evidence integration test runs
    # instead of being skipped. Nothing outside this job uses the database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revluma
          POSTGRES_PASSWORD: revluma_ci_local_only
          POSTGRES_DB: revluma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://placeholder:placeholder@localhost:5432/placeholder
      TASK198_DATABASE_URL: postgresql+psycopg2://revluma:revluma_ci_local_only@localhost:5432/revluma_test
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned to the interpreter the runtime is certified against.
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python sources and tests
        run: python -m compileall -q src tests
      - name: Run Gemini, routing and web research regressions
        run: python -m pytest -q tests/test_model_gateway.py tests/test_rev_failure_routing.py
      - name: Run all Python tests
        run: python -m pytest -q tests
      - name: Record Python interpreter and installed packages
        if: failure()
        run: |
          python --version
          python -m pip list --format=columns
